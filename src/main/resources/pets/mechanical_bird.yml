schema-version: 1
display-name: "<aqua>Mechanical Bird</aqua>"
description:
  - "<gray>Hiyerarşik display bone'larıyla kanat çırpan mekanik familiar.</gray>"
gui-material: FEATHER
representation:
  type: DISPLAY_MODEL
  root: body
  parts:
    body:
      type: ITEM
      material: IRON_NUGGET
      model-data: 13101
      scale: [0.85, 0.85, 0.85]
    left-wing:
      parent: body
      type: ITEM
      material: FEATHER
      model-data: 13102
      transform:
        translation: [0.55, 0.05, 0.0]
        rotation: [0.0, 0.0, -12.0]
        scale: [0.75, 0.75, 0.75]
    right-wing:
      parent: body
      type: ITEM
      material: FEATHER
      model-data: 13103
      transform:
        translation: [-0.55, 0.05, 0.0]
        rotation: [0.0, 0.0, 12.0]
        scale: [0.75, 0.75, 0.75]
  animations:
    IDLE:
      duration-ticks: 40
      loop: true
      bones:
        body:
          - tick: 0
            translation: [0.0, 0.0, 0.0]
          - tick: 20
            translation: [0.0, 0.08, 0.0]
          - tick: 40
            translation: [0.0, 0.0, 0.0]
        left-wing:
          - tick: 0
            rotation: [0.0, 0.0, -8.0]
          - tick: 20
            rotation: [0.0, 0.0, 8.0]
          - tick: 40
            rotation: [0.0, 0.0, -8.0]
        right-wing:
          - tick: 0
            rotation: [0.0, 0.0, 8.0]
          - tick: 20
            rotation: [0.0, 0.0, -8.0]
          - tick: 40
            rotation: [0.0, 0.0, 8.0]
    MOVING:
      duration-ticks: 10
      loop: true
      bones:
        left-wing:
          - tick: 0
            rotation: [0.0, 0.0, -35.0]
          - tick: 5
            rotation: [0.0, 0.0, 35.0]
          - tick: 10
            rotation: [0.0, 0.0, -35.0]
        right-wing:
          - tick: 0
            rotation: [0.0, 0.0, 35.0]
          - tick: 5
            rotation: [0.0, 0.0, -35.0]
          - tick: 10
            rotation: [0.0, 0.0, 35.0]
movement:
  type: FLYING_FOLLOW
  height: 1.45
  side-offset: 0.75
  follow-speed: 0.2
  update-interval-ticks: 1
progression:
  enabled: true
  maximum-level: 100
nameplate:
  enabled: true
  format:
    - "<aqua>{pet_name}</aqua> <gray>Lv.{level}</gray>"

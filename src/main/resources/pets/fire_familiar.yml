schema-version: 1
display-name: "<gold>Fire Familiar</gold>"
description:
  - "<yellow>Çekirdek, taç ve alev aurasından oluşan composite pet.</yellow>"
gui-material: BLAZE_POWDER
representation:
  type: COMPOSITE
  root: body
  components:
    body:
      type: ITEM_DISPLAY
      item-material: BLAZE_POWDER
      custom-model-data: 12101
      scale: [0.9, 0.9, 0.9]
    crown:
      parent: body
      type: ITEM_DISPLAY
      item-material: GOLD_NUGGET
      custom-model-data: 12102
      transform:
        translation: [0.0, 0.55, 0.0]
        rotation: [0.0, 0.0, 0.0]
        scale: [0.45, 0.45, 0.45]
    aura:
      parent: body
      type: PARTICLE
      particle-type: FLAME
      particle-count: 5
      particle-offset: 0.25
      particle-speed: 0.01
      transform:
        translation: [0.0, 0.1, 0.0]
movement:
  type: FLYING_FOLLOW
  height: 1.25
  side-offset: 0.8
  follow-speed: 0.18
  update-interval-ticks: 2
progression:
  enabled: true
  maximum-level: 100
nameplate:
  enabled: true
  format:
    - "<gold>{pet_name}</gold> <gray>Lv.{level}</gray>"

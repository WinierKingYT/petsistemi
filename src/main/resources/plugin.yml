name: PetSistemi
version: '${version}'
main: com.petsistemi.PetSistemiPlugin
api-version: '1.20'
author: Antigravity
description: Advanced modular Paper 1.20.4 Pet System Plugin (mob, item-display, orbit & familiar pets)

commands:
  pet:
    description: Oyuncu pet yönetim ve GUI komutu.
    aliases: [companion, pets]
    permission: companionpets.use
    usage: /pet [list|summon|dismiss|info|rename|mode|emote|help]
  petadmin:
    description: Yönetici pet yönetim komutları.
    usage: /petadmin <give|remove|list|info|addxp|setxp|setlevel|summon|dismiss|reload|inspect|health|backup|reconcile|disable|enable>

permissions:
  companionpets.use:
    description: Pet sistemi temel oyuncu komutlarını ve GUI kullanım yetkisi.
    default: true
  companionpets.admin:
    description: Tüm yönetici komutlarına genel erişim yetkisi.
    default: op
    children:
      companionpets.admin.give: true
      companionpets.admin.remove: true
      companionpets.admin.list: true
      companionpets.admin.info: true
      companionpets.admin.addxp: true
      companionpets.admin.setxp: true
      companionpets.admin.setlevel: true
      companionpets.admin.summon: true
      companionpets.admin.dismiss: true
      companionpets.admin.reload: true
      companionpets.admin.inspect: true
      companionpets.admin.health: true
      companionpets.admin.backup: true
      companionpets.admin.reconcile: true
      companionpets.admin.disable: true
      companionpets.admin.enable: true
  companionpets.admin.give:
    description: Oyunculara pet verme yetkisi.
    default: op
  companionpets.admin.remove:
    description: Pet silme yetkisi.
    default: op
  companionpets.admin.list:
    description: Oyuncunun petlerini listeleme yetkisi.
    default: op
  companionpets.admin.info:
    description: Pet detaylarını görüntüleme yetkisi.
    default: op
  companionpets.admin.addxp:
    description: Pete XP ekleme yetkisi.
    default: op
  companionpets.admin.setxp:
    description: Pet XP ayarlama yetkisi.
    default: op
  companionpets.admin.setlevel:
    description: Pet seviye ayarlama yetkisi.
    default: op
  companionpets.admin.summon:
    description: Oyuncunun petini çağırma yetkisi.
    default: op
  companionpets.admin.dismiss:
    description: Oyuncunun petini kaldırma yetkisi.
    default: op
  companionpets.admin.reload:
    description: Konfigürasyon yenileme yetkisi.
    default: op
  companionpets.admin.inspect:
    description: Baktığı varlığı denetleme yetkisi.
    default: op
  companionpets.admin.health:
    description: Sistem sağlık durumunu görüntüleme yetkisi.
    default: op
  companionpets.admin.backup:
    description: Manuel yedek alma yetkisi.
    default: op
  companionpets.admin.reconcile:
    description: Veritabanı ve dünya pet uzlaştırma yetkisi.
    default: op
  companionpets.admin.disable:
    description: Pet devre dışı bırakma yetkisi.
    default: op
  companionpets.admin.enable:
    description: Pet etkinleştirme yetkisi.
    default: op
  # Pet tanımlarındaki `permission:` alanı çağırma sırasında zorunlu tutulur.
  # Paketlenmiş petler varsayılan olarak herkese açıktır; kısıtlamak için
  # ilgili düğümü izin eklentinizde false yapmanız yeterlidir.
  companionpets.pet.wolf:
    description: Kurt Dostu petini kullanma yetkisi.
    default: true
  companionpets.pet.arcanecrystal:
    description: Arcane Crystal petini kullanma yetkisi.
    default: true
  companionpets.pet.floatingbook:
    description: Floating Book petini kullanma yetkisi.
    default: true
  companionpets.pet.shoulderorb:
    description: Shoulder Orb petini kullanma yetkisi.
    default: true
  companionpets.pet.ghostscribe:
    description: Ghost Scribe petini kullanma yetkisi.
    default: true
  companionpets.pet.spiritflame:
    description: Spirit Flame petini kullanma yetkisi.
    default: true
  companionpets.pet.familiarswarm:
    description: Familiar Swarm petini kullanma yetkisi.
    default: true
  companionpets.pet.voidcube:
    description: Void Cube petini kullanma yetkisi.
    default: true
  companionpets.pet.sleepycat:
    description: Uyuyan Kedi petini kullanma yetkisi.
    default: true
  companionpets.pet.wisplight:
    description: Wisplight petini kullanma yetkisi.
    default: true
  companionpets.pet.shadowwisp:
    description: Gölge Zerresi petini kullanma yetkisi.
    default: true
  companionpets.pet.mirrordoll:
    description: Yansıma Bebek petini kullanma yetkisi.
    default: true
  companionpets.pet.echophantom:
    description: Yankı Hayaleti petini kullanma yetkisi.
    default: true
  companionpets.pet.roamfox:
    description: Gezgin Tilki petini kullanma yetkisi.
    default: true
  petsistemi.pet.phoenix:
    description: Zümrüdü Anka petini kullanma yetkisi.
    default: true
  petsistemi.pet.swarmbees:
    description: Arı Sürüsü petini kullanma yetkisi.
    default: true

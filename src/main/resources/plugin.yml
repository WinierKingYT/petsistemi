name: PetSistemi
version: '${version}'
main: com.petsistemi.PetSistemiPlugin
api-version: '1.20'
description: Advanced modular Paper 1.20.4 Minecraft pet system
commands:
  pet:
    description: Pet system command
    usage: /pet
    permission: companionpets.use
  petadmin:
    description: Pet admin command
    usage: /petadmin
    permission: companionpets.admin
permissions:
  companionpets.use:
    description: Allows using the pet system
    default: true
  companionpets.admin:
    description: Allows using administrative commands
    default: op

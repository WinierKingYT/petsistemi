# PetSistemi Yapılandırması

locale: 'tr_TR'

limits:
  maximum-owned-pets: 20

naming:
  minimum-length: 2
  maximum-length: 16
  allow-colors: false
  allow-formatting: false

progression:
  enabled: true
  maximum-level: 100
  # XP her seviye başına gereken miktar (LinearExperienceCurve)
  # Lv2 için: 1 * xp-per-level, Lv10 için: 9 * xp-per-level
  xp-per-level: 100

runtime:
  tick-interval-ticks: 5
  start-distance: 5.0
  stop-distance: 2.0
  teleport-distance: 15.0
  follow-speed: 1.2

database:
  migration-backup:
    enabled: true
    fail-startup-on-backup-error: true
    maximum-backups: 5

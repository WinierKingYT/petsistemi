# PetSistemi Yapılandırması

locale: 'tr_TR'

gui:
  title: 'Pet Menüsü'

limits:
  maximum-owned-pets: 20

naming:
  minimum-length: 2
  maximum-length: 16
  allow-colors: false
  allow-formatting: false

progression:
  enabled: true
  maximum-level: 100
  # XP her seviye başına gereken miktar (LinearExperienceCurve)
  xp-per-level: 100
  # Pasif XP — her 1 dakikada (1200t) petlere verilen XP miktarı
  passive-xp-per-minute: 10
  # Yürüme: her N blokta M XP kazanılır
  walk-xp-threshold: 50.0
  walk-xp-amount: 5
  # Blok kırma: sabit XP (0 = devre dışı)
  block-break-xp: 2
  # Mob öldürme: maks-can × çarpan (0.5 = max-can/2)
  kill-xp-multiplier: 0.5

runtime:
  tick-interval-ticks: 5
  start-distance: 5.0
  stop-distance: 2.0
  teleport-distance: 15.0
  follow-speed: 1.2

database:
  # SQLITE tek sunucu için varsayılandır. MYSQL network modu ve paylaşımlı veri için kullanılır.
  backend: SQLITE
  mysql:
    host: 127.0.0.1
    port: 3306
    database: petsistemi
    username: root
    password: ""
    use-ssl: false
    connect-timeout-ms: 10000
  migration-backup:
    enabled: true
    fail-startup-on-backup-error: true
    maximum-backups: 5

ecosystem:
  network:
    enabled: false
    # Aynı MySQL veritabanını kullanan her sunucuda benzersiz olmalıdır.
    server-id: server-1
    poll-interval-ticks: 20
    batch-size: 100
    retention-hours: 24
  pet-packs:
    maximum-files: 128
    maximum-archive-bytes: 10485760
    maximum-expanded-bytes: 52428800
  marketplace:
    enabled: false
    catalog-url: ""
    require-sha256: true
    maximum-download-bytes: 10485760
    request-timeout-ms: 10000

features:
  # Petlerin sahiplerine verdiği pasif etkiler. Hangi etkinin verileceği her petin
  # kendi pets/<id>.yml dosyasındaki `buffs:` bölümünde yazar; buradaki anahtar
  # yalnızca hepsini birden kapatmak içindir.
  buffs:
    enabled: true
  particles:
    enabled: false
  magnet:
    enabled: false
  riding:
    # Ana özellik anahtarı. Pet bazında mount.enabled:false ile ayrıca kapatılabilir.
    # Sahip shift + sağ tıkla biner; WASD yön, Space zıplama, Shift inme kontrolüdür.
    enabled: false
  idle-sleep:
    # Sahip N saniye hareket etmezse pet uyku moduna geçer (ENTITY: oturur, display: küçülür)
    enabled: false
    idle-seconds: 45
  reactions:
    # Pet tepkileri: sahip hasar alınca sinirlenme, seviye atlayınca mutluluk, uyku sesleri
    enabled: false
  level-scaling:
    # Display petler seviye başına boyut artar (1. + growth × (level-1), cap max-multiplier)
    enabled: false
    growth-per-level: 0.02
    max-multiplier: 1.5


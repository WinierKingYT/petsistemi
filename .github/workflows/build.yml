name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make Gradle wrapper executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew clean build

    # Version is never hardcoded here: a version bump used to leave this step matching
    # nothing, and upload-artifact only warns by default — CI stayed green while
    # publishing no jar at all. `if-no-files-found: error` makes that fail loudly.
    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PetSistemi
        path: build/libs/PetSistemi-*.jar
        if-no-files-found: error
